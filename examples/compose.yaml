services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 1s
      timeout: 2s
      retries: 10
  api:
    image: node:24-alpine
    command: ["node", "/app/api.mjs"]
    volumes:
      - ./api.mjs:/app/api.mjs:ro
    ports:
      - "127.0.0.1::3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/broken').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 1s
      timeout: 2s
      retries: 2
      start_period: 1s
  debug:
    image: node:24-alpine
    command: ["node", "-e", "setInterval(()=>{},1000)"]
    profiles: [debug]
volumes:
  pgdata:
